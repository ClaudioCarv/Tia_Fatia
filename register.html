<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#D62828">
    <title>Tia Fatia 🍕 | Criar sua Conta</title>
    
    <link rel="icon" href="img/Tia-fatia-logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: radial-gradient(circle at top, #FFF8E7 0%, #FAF7F2 100%);">

    <!-- NAVBAR SIMPLES -->
    <header class="header-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="img/logoS.png" alt="Logo Tia Fatia" class="brand-logo">
                <span>
                    Tia Fatia
                    <small>Pizza por Fatia</small>
                </span>
            </a>
            <a href="index.html" class="btn-secondary" style="padding: 0.4rem 1rem; font-size: 0.85rem;">
                Voltar ao Cardápio
            </a>
        </div>
    </header>

    <!-- WRAPPER CENTRALIZADO DE CADASTRO -->
    <main class="auth-wrapper">
        <div class="auth-card">
            
            <a href="index.html">
                <img src="img/logoS.png" alt="Logo Tia Fatia" class="auth-logo">
            </a>

            <h1 class="auth-title">Crie sua Conta</h1>
            <p class="auth-subtitle">Cadastre-se para acumular pontos e pedir com apenas 1 clique!</p>

            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <label for="fullName">Seu Nome Completo:</label>
                    <input type="text" id="fullName" placeholder="Ex: Cláudio Carvalho" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="emailOrPhone">E-mail ou WhatsApp:</label>
                    <input type="text" id="emailOrPhone" placeholder="seu@email.com ou (83) 99999-9999" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Crie uma Senha:</label>
                    <div class="password-input-wrap">
                        <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required autocomplete="new-password">
                        <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('password', this)" aria-label="Mostrar ou esconder senha">
                            👁️
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirme a Senha:</label>
                    <div class="password-input-wrap">
                        <input type="password" id="confirmPassword" placeholder="Repita a mesma senha" minlength="6" required autocomplete="new-password">
                        <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)" aria-label="Mostrar ou esconder senha">
                            👁️
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem; justify-content: center;">
                    <span>Criar Conta Grátis</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <p class="auth-footer-text">
                Já possui uma conta? <a href="login.html">Faça login</a>
            </p>
        </div>
    </main>

    <script src="app.js"></script>
    <script src="signup.js"></script>
</body>
</html>
